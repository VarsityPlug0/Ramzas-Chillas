services:
  - type: web
    name: RamzaKitchen
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd Ramza && python start_server.py"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 4