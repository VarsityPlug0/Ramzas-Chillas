services:
  - type: web
    name: RamzaKitchen
    env: python
    buildCommand: "pip install -r requirements.txt && python build_frontend.py && python manage.py collectstatic --noinput"
    startCommand: "python start_server.py"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 4
      - key: CSRF_TRUSTED_ORIGINS
        value: https://ramzas-chillas.onrender.com,https://ramza-ut50.onrender.com,https://ramzakitchen.onrender.com,https://ramzas-chillas.site
      # AWS S3 Storage Configuration (configure these in Render dashboard)
      # - key: AWS_STORAGE_BUCKET_NAME
      #   sync: false
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false
      # - key: AWS_S3_REGION_NAME
      #   value: us-east-1